services:
  frontend:
    image: node:20-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_ORIGIN: http://app:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      app:
        condition: service_started

  app:
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    environment:
      FRONTEND_MODE: dev
      FRONTEND_DEV_ORIGIN: http://frontend:5173
    volumes:
      - .:/app
      - /app/__pycache__
