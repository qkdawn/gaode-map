<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1398" viewBox="0 0 1840 1398"><style>.title{font:700 30px 'Microsoft YaHei',Arial,sans-serif;fill:#12352A}.subtitle{font:400 16px 'Microsoft YaHei',Arial,sans-serif;fill:#547168}.column{font:700 17px 'Microsoft YaHei',Arial,sans-serif;fill:#164D3C}.card-title{font:700 17px 'Microsoft YaHei',Arial,sans-serif;fill:#173F33}.card-text{font:400 15px 'Microsoft YaHei',Arial,sans-serif;fill:#24483D}.arrow{stroke:#729B8A;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#729B8A"/></marker></defs><rect width="1840" height="1398" fill="#F7FAF8"/><text x="40" y="48" class="title">空间商业决策逻辑图</text><text x="40" y="76" class="subtitle">事实与条件如何推导当前选择；每个节点保留反例、指标边界和验证路径。</text><text x="40" y="106" class="column">条件与事实</text><text x="388" y="106" class="column">判断规则与指标</text><text x="696" y="106" class="column">候选与反例</text><text x="1044" y="106" class="column">当前结论与动作</text><text x="1452" y="106" class="column">验证与边界</text><rect x="40" y="126" width="330" height="196" rx="8" fill="#FFF7E6" stroke="#A95A00" stroke-width="1.5"/><text x="58" y="172" class="card-title">条件与事实</text><text x="58" y="198" class="card-text">原始材料确认行政旧址、礼堂庭院与连续居住</text><text x="58" y="220" class="card-text">并存。</text><text x="58" y="242" class="card-text">没有项目级到达、支付、客流或高强度运营证</text><text x="58" y="264" class="card-text">据。</text><line x1="374" y1="224" x2="383" y2="224" class="arrow"/><rect x="388" y="126" width="290" height="196" rx="8" fill="#FFF7E6" stroke="#A95A00" stroke-width="1.5"/><text x="406" y="172" class="card-title">R1 | 项目角色与首要价值</text><text x="406" y="198" class="card-text">未使用空间指标</text><line x1="682" y1="224" x2="691" y2="224" class="arrow"/><rect x="696" y="126" width="330" height="196" rx="8" fill="#FFF7E6" stroke="#A95A00" stroke-width="1.5"/><text x="714" y="172" class="card-title">候选与反例</text><text x="714" y="198" class="card-text">有明确机构任务的预约型解释</text><text x="714" y="220" class="card-text">居民优先的协商与公共服务</text><text x="714" y="242" class="card-text">反例: 若获得真实持续到达、独特吸引物、</text><text x="714" y="264" class="card-text">许可承载和运营组织的直接证据，才重新比较</text><text x="714" y="286" class="card-text">目的地型路径。</text><line x1="1030" y1="224" x2="1039" y2="224" class="arrow"/><rect x="1044" y="126" width="390" height="196" rx="8" fill="#FFF7E6" stroke="#A95A00" stroke-width="1.5"/><text x="1062" y="172" class="card-title">当前结论与动作</text><text x="1062" y="198" class="card-text">结论: 当前只可比较低干扰的档案解释/社</text><text x="1062" y="220" class="card-text">区服务情景；项目尚不能被认定为目的地型文</text><text x="1062" y="242" class="card-text">商旅项目。</text><text x="1062" y="264" class="card-text">动作: 将首要工作从招商和业态填充转为核</text><text x="1062" y="286" class="card-text">验历史解释、公共任务与居民共建价值。</text><line x1="1438" y1="224" x2="1447" y2="224" class="arrow"/><rect x="1452" y="126" width="330" height="196" rx="8" fill="#FFF7E6" stroke="#A95A00" stroke-width="1.5"/><text x="1470" y="172" class="card-title">验证与边界</text><text x="1470" y="198" class="card-text">历史资源和区域空间背景不能证明市场需求、</text><text x="1470" y="220" class="card-text">客流或经营能力。</text><text x="1470" y="242" class="card-text">验证: 完成项目级档案核验、业主/社区公</text><text x="1470" y="264" class="card-text">共任务确认及机构需求记录。</text><rect x="40" y="346" width="330" height="284" rx="8" fill="#FFF7E6" stroke="#A95A00" stroke-width="1.5"/><text x="58" y="392" class="card-title">条件与事实</text><text x="58" y="418" class="card-text">现住户是已确认权利主体，但其参与意愿和服</text><text x="58" y="440" class="card-text">务需求尚未记录。</text><text x="58" y="462" class="card-text">学校、档案文保和研究组织只具备候选机制，</text><text x="58" y="484" class="card-text">缺少任务书、预约与履约证据。</text><line x1="374" y1="488" x2="383" y2="488" class="arrow"/><rect x="388" y="346" width="290" height="284" rx="8" fill="#FFF7E6" stroke="#A95A00" stroke-width="1.5"/><text x="406" y="392" class="card-title">R2 | 服务对象与价值交换</text><text x="406" y="418" class="card-text">population.age_structure</text><text x="406" y="440" class="card-text">15分钟范围人口代理约58201，仅提供</text><text x="406" y="462" class="card-text">社区服务背景。</text><text x="406" y="484" class="card-text">影响: 将验证重点限定为本地服务与机构预</text><text x="406" y="506" class="card-text">约，而非用人口外推客流。</text><text x="406" y="528" class="card-text">poi.supply_structure</text><text x="406" y="550" class="card-text">范围内已有文化教育、日常餐饮和零售供给。</text><text x="406" y="572" class="card-text">影响: 避免以补常规供给假设市场空白，优</text><text x="406" y="594" class="card-text">先验证不可替代的档案与协商任务。</text><line x1="682" y1="488" x2="691" y2="488" class="arrow"/><rect x="696" y="346" width="330" height="284" rx="8" fill="#FFF7E6" stroke="#A95A00" stroke-width="1.5"/><text x="714" y="392" class="card-title">候选与反例</text><text x="714" y="418" class="card-text">面向住户的非消费性服务</text><text x="714" y="440" class="card-text">机构预约的研究/学习任务</text><text x="714" y="462" class="card-text">获准后的低频专题访问</text><text x="714" y="484" class="card-text">反例: 若候选对象无明确任务、选择替代场</text><text x="714" y="506" class="card-text">所、无法到达或拒绝参与，则停止对应情景。</text><line x1="1030" y1="488" x2="1039" y2="488" class="arrow"/><rect x="1044" y="346" width="390" height="284" rx="8" fill="#FFF7E6" stroke="#A95A00" stroke-width="1.5"/><text x="1062" y="392" class="card-title">当前结论与动作</text><text x="1062" y="418" class="card-text">结论: 不形成已确认外部目标客群；只保留</text><text x="1062" y="440" class="card-text">居民、机构研究/学习和低频预约访客作为待</text><text x="1062" y="462" class="card-text">验证对象。</text><text x="1062" y="484" class="card-text">动作: 以知情同意、机构任务书、预约签到</text><text x="1062" y="506" class="card-text">、到达与服务完成记录作为进入下一轮比较的</text><text x="1062" y="528" class="card-text">准入证据。</text><line x1="1438" y1="488" x2="1447" y2="488" class="arrow"/><rect x="1452" y="346" width="330" height="284" rx="8" fill="#FFF7E6" stroke="#A95A00" stroke-width="1.5"/><text x="1470" y="392" class="card-title">验证与边界</text><text x="1470" y="418" class="card-text">人口与POI只能支持候选筛选，不能替代访</text><text x="1470" y="440" class="card-text">谈、预约、支付或公共服务履约。</text><text x="1470" y="462" class="card-text">验证: WP-01居民基线、WP-03机</text><text x="1470" y="484" class="card-text">构任务核验和WP-04预约到达测试完成并</text><text x="1470" y="506" class="card-text">保留原始记录。</text><rect x="40" y="654" width="330" height="196" rx="8" fill="#FFF7E6" stroke="#A95A00" stroke-width="1.5"/><text x="58" y="700" class="card-title">条件与事实</text><text x="58" y="726" class="card-text">礼堂、庭院与主路径是材料中的候选公共解释</text><text x="58" y="748" class="card-text">空间。</text><text x="58" y="770" class="card-text">正式红线、产权、单体许可、结构消防无障碍</text><text x="58" y="792" class="card-text">、承载与住户同意均未闭合。</text><line x1="374" y1="752" x2="383" y2="752" class="arrow"/><rect x="388" y="654" width="290" height="196" rx="8" fill="#FFF7E6" stroke="#A95A00" stroke-width="1.5"/><text x="406" y="700" class="card-title">R3 | 空间、保护与居民边界</text><text x="406" y="726" class="card-text">未使用空间指标</text><line x1="682" y1="752" x2="691" y2="752" class="arrow"/><rect x="696" y="654" width="330" height="196" rx="8" fill="#FFF7E6" stroke="#A95A00" stroke-width="1.5"/><text x="714" y="700" class="card-title">候选与反例</text><text x="714" y="726" class="card-text">获准后的小规模日间预约解释</text><text x="714" y="748" class="card-text">仅线上档案解释与不入场服务</text><text x="714" y="770" class="card-text">反例: 若许可、结构、消防、隐私或投诉条</text><text x="714" y="792" class="card-text">件不成立，取消线下访问或进一步收缩范围。</text><line x1="1030" y1="752" x2="1039" y2="752" class="arrow"/><rect x="1044" y="654" width="390" height="196" rx="8" fill="#FFF7E6" stroke="#A95A00" stroke-width="1.5"/><text x="1062" y="700" class="card-title">当前结论与动作</text><text x="1062" y="726" class="card-text">结论: 任何空间在书面许可与安全结论前均</text><text x="1062" y="748" class="card-text">不进入开放承诺；宿舍及住户空间默认退出游</text><text x="1062" y="770" class="card-text">客动线。</text><text x="1062" y="792" class="card-text">动作: 先形成开放/受控/不开放清单和居</text><text x="1062" y="814" class="card-text">民边界图，再设计容量、时段和路径。</text><line x1="1438" y1="752" x2="1447" y2="752" class="arrow"/><rect x="1452" y="654" width="330" height="196" rx="8" fill="#FFF7E6" stroke="#A95A00" stroke-width="1.5"/><text x="1470" y="700" class="card-title">验证与边界</text><text x="1470" y="726" class="card-text">项目中心点等时圈、路网和POI不等于项目</text><text x="1470" y="748" class="card-text">入口、开放边界或空间承载。</text><text x="1470" y="770" class="card-text">验证: WP-02许可与承载准入、WP-</text><text x="1470" y="792" class="card-text">01居民知情同意和投诉响应机制通过。</text><rect x="40" y="874" width="330" height="218" rx="8" fill="#FFF7E6" stroke="#A95A00" stroke-width="1.5"/><text x="58" y="920" class="card-title">条件与事实</text><text x="58" y="946" class="card-text">现有材料没有运营主体、预算、人力、预约、</text><text x="58" y="968" class="card-text">收入成本或服务履约记录。</text><text x="58" y="990" class="card-text">住居与保护冲突不能由高强度商业活动自动化</text><text x="58" y="1012" class="card-text">解。</text><line x1="374" y1="983" x2="383" y2="983" class="arrow"/><rect x="388" y="874" width="290" height="218" rx="8" fill="#FFF7E6" stroke="#A95A00" stroke-width="1.5"/><text x="406" y="920" class="card-title">R4 | 运营责任与持续机制</text><text x="406" y="946" class="card-text">未使用空间指标</text><line x1="682" y1="983" x2="691" y2="983" class="arrow"/><rect x="696" y="874" width="330" height="218" rx="8" fill="#FFF7E6" stroke="#A95A00" stroke-width="1.5"/><text x="714" y="920" class="card-title">候选与反例</text><text x="714" y="946" class="card-text">公共服务委托或共建</text><text x="714" y="968" class="card-text">有明确任务的低频机构预约</text><text x="714" y="990" class="card-text">反例: 若没有主体承担协商、维护与安全，</text><text x="714" y="1012" class="card-text">或机制依赖扰民的高强度使用，则停止运营扩</text><text x="714" y="1034" class="card-text">张。</text><line x1="1030" y1="983" x2="1039" y2="983" class="arrow"/><rect x="1044" y="874" width="390" height="218" rx="8" fill="#FFF7E6" stroke="#A95A00" stroke-width="1.5"/><text x="1062" y="920" class="card-title">当前结论与动作</text><text x="1062" y="946" class="card-text">结论: 当前不能把餐饮、夜游、演出、场租</text><text x="1062" y="968" class="card-text">或招商作为现金流或运营基础；应先验证多主</text><text x="1062" y="990" class="card-text">体责任机制。</text><text x="1062" y="1012" class="card-text">动作: 建立业主、社区、文保/档案主体和</text><text x="1062" y="1034" class="card-text">管理方的权责、维护、安全、投诉与服务记录</text><text x="1062" y="1056" class="card-text">机制。</text><line x1="1438" y1="983" x2="1447" y2="983" class="arrow"/><rect x="1452" y="874" width="330" height="218" rx="8" fill="#FFF7E6" stroke="#A95A00" stroke-width="1.5"/><text x="1470" y="920" class="card-title">验证与边界</text><text x="1470" y="946" class="card-text">周边消费、夜光或POI不构成项目预算、收</text><text x="1470" y="968" class="card-text">入或成本依据。</text><text x="1470" y="990" class="card-text">验证: WP-05形成责任矩阵并完成一个</text><text x="1470" y="1012" class="card-text">可复核的服务周期。</text><rect x="40" y="1116" width="330" height="218" rx="8" fill="#FFF7E6" stroke="#A95A00" stroke-width="1.5"/><text x="58" y="1162" class="card-title">条件与事实</text><text x="58" y="1188" class="card-text">项目事实和空间条件足以提出比较路径，但市</text><text x="58" y="1210" class="card-text">场、许可、支付和运营证据未闭合。</text><text x="58" y="1232" class="card-text">保护和居民权益要求任何失败都可迅速停止且</text><text x="58" y="1254" class="card-text">可恢复。</text><line x1="374" y1="1225" x2="383" y2="1225" class="arrow"/><rect x="388" y="1116" width="290" height="218" rx="8" fill="#FFF7E6" stroke="#A95A00" stroke-width="1.5"/><text x="406" y="1162" class="card-title">R5 | 首期试验与分期</text><text x="406" y="1188" class="card-text">isochrone.reachable_area</text><text x="406" y="1210" class="card-text">当前等时圈中心点已规范坐标但无正式项目边</text><text x="406" y="1232" class="card-text">界。</text><text x="406" y="1254" class="card-text">影响: 要求在批准入口确定后记录真实预约</text><text x="406" y="1276" class="card-text">到达，而非使用当前等时圈做入口或客流承诺</text><text x="406" y="1298" class="card-text">。</text><line x1="682" y1="1225" x2="691" y2="1225" class="arrow"/><rect x="696" y="1116" width="330" height="218" rx="8" fill="#FFF7E6" stroke="#A95A00" stroke-width="1.5"/><text x="714" y="1162" class="card-title">候选与反例</text><text x="714" y="1188" class="card-text">不开放线下，仅完成档案和治理准备</text><text x="714" y="1210" class="card-text">许可范围内的单一机构任务试验</text><text x="714" y="1232" class="card-text">反例: 出现安全、保护、居民权益或持续使</text><text x="714" y="1254" class="card-text">用失败信号时，停止线下试验并回到前置核验</text><text x="714" y="1276" class="card-text">。</text><line x1="1030" y1="1225" x2="1039" y2="1225" class="arrow"/><rect x="1044" y="1116" width="390" height="218" rx="8" fill="#FFF7E6" stroke="#A95A00" stroke-width="1.5"/><text x="1062" y="1162" class="card-title">当前结论与动作</text><text x="1062" y="1188" class="card-text">结论: 采用可逆、日间、预约、小规模试验</text><text x="1062" y="1210" class="card-text">作为唯一可讨论的首期情景；不进入建设或高</text><text x="1062" y="1232" class="card-text">投入实施承诺。</text><text x="1062" y="1254" class="card-text">动作: 以试验记录同时校准内容价值、到达</text><text x="1062" y="1276" class="card-text">、居民边界、容量、成本与责任，并以触发条</text><text x="1062" y="1298" class="card-text">件决定扩大、调整或停止。</text><line x1="1438" y1="1225" x2="1447" y2="1225" class="arrow"/><rect x="1452" y="1116" width="330" height="218" rx="8" fill="#FFF7E6" stroke="#A95A00" stroke-width="1.5"/><text x="1470" y="1162" class="card-title">验证与边界</text><text x="1470" y="1188" class="card-text">情景参数不是预测；试验样本不得外推年度客</text><text x="1470" y="1210" class="card-text">流、收入或ROI。</text><text x="1470" y="1232" class="card-text">验证: WP-01至WP-05完成；出现</text><text x="1470" y="1254" class="card-text">任何安全、保护或扰民触发信号即暂停。</text></svg>