- id: spatial.global_moran_i_density
  name: POI 密度全局莫兰指数
  family: spatial_statistics
  implementation_status: implemented
  outputs:
  - global_moran_i_density
  - global_moran_z_score
  required_inputs:
  - grid_metric_values
  - spatial_weights
  - method_parameters
  definition: 网格 POI 密度的全局空间自相关统计量。
  unit: statistic
  answers_questions:
  - 研究范围内的输入指标整体上是否表现为空间聚集、离散或随机？
  spatial_granularities:
  - unit: scope
    neighborhood: none
    runtime_parameters: []
  supports:
  - 识别研究范围整体是否存在显著空间自相关，并决定是否需要继续局部定位。
  does_not_support:
  - 局部热点位置
  - 入口或功能分配位置
  - 聚集原因
  - 商业成功
  - 因果关系
  use_when:
  - hotspot_detection
  - spatial_clustering
  - spatial_outlier
  actionability:
    action_targets:
    - analysis_method
    possible_actions:
    - 若整体聚集显著，继续执行 Gi* 与 LISA 定位连续热点和局部异常；若不显著，停止把全局聚集作为空间动作依据。
  followup_metrics:
  - metric_id: spatial.gi_star
    purpose: locate
    trigger: 全局 Moran’s I 显著且决策需要定位连续高值或低值区域
  - metric_id: spatial.lisa
    purpose: disconfirm
    trigger: 需要检查全局聚集是否由局部异常或不同聚类类型驱动
  valid_comparisons:
  - same_spatial_weights
  - same_input_metric
  - same_significance_method
  quality_requirements:
  - value_variance
  - neighbor_definition
  - significance_available
  source:
  - modules/h3/stats.py
  - modules/h3/arcgis_facade.py
  comparison_baseline:
    required: true
    preferred:
    - statistical_null_expectation
    - same_source_peer_scope
    if_missing: 执行同一空间权重与显著性方法下的置换或零假设检验；缺失时只报告描述性分布，不称显著聚集、热点或异常。
