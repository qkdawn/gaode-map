catalog_version: 2.0.0
catalog_status: semantic_catalog
scope: 当前仓库可用、派生或受阻的空间指标语义目录。
interpretation_policy:
- 仅有数量、密度、人口、夜光或路网指标时，不直接表述需求、客流、营业额、购买力或投资回报。
- 比较性指标必须记录比较范围、时间、分类口径、空间分辨率和方法参数。
- 前端派生指标依赖当前批次数据和前端阈值，不视为后端稳定事实。
- implementation_status 为 not_implemented 的指标只能作为证据缺口，不得作为现有证据调用或用相似字段替代。
metrics:
- id: poi.count
  name: POI 数量
  family: poi
  implementation_status: implemented
  outputs:
  - count
  - category_counts
  - summary_by_year.count
  required_inputs:
  - poi_records
  - scope_geometry
  - time_scope
  - category_schema
  definition: 研究范围或指定网格内去重后的 POI 记录数。
  unit: places
  answers_questions:
  - 哪些设施供给或类别差异会改变项目定位、运营或入口服务对象？
  spatial_granularities:
  - unit: scope
    neighborhood: none
    runtime_parameters: []
  - unit: catchment
    neighborhood: distance
    runtime_parameters:
    - catchment_id
  supports:
  - 设施供给的数量分布
  - 类别之间的数量比较
  does_not_support:
  - 实际营业
  - 客流
  - 需求强度
  - 市场饱和
  use_when:
  - facility_supply
  - category_structure
  - competition_context
  actionability:
    action_targets: &id001
    - program_location
    - operations
    possible_actions:
    - 据设施供给与类别缺口调整功能组合、招商或运营验证。
  followup_metrics:
  - metric_id: population.total
    purpose: explain
    trigger: 当前指标形成需要解释的差异时
  - metric_id: road.integration
    purpose: validate
    trigger: 当前结论将直接改变项目动作时
  valid_comparisons:
  - same_year
  - same_source
  - same_category_schema
  - same_scope_definition
  quality_requirements:
  - duplicate_check
  - category_normalization
  - coverage_check
  source:
  - modules/poi/aggregation.py
  - modules/poi/schemas.py
  comparison_baseline:
    required: true
    preferred:
    - same_source_peer_scope
    - same_scope_previous_period
    - same_scope_category_share
    if_missing: 建立同源、同年、同分类和同范围定义的同类范围或历史基准；在此之前只报告设施清单与范围内构成。
