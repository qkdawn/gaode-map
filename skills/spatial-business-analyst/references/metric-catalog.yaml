  definition: 对同层级竞品的到访、出租、活动、营收或运营表现进行可比核验的证据门槛。
  unit: evidence_gate
  answers_questions:
  - 哪个定位方向具有相对竞争优势，而不是仅有设施供给差异？
  spatial_granularities:
  - unit: scope
    neighborhood: none
    runtime_parameters: []
  supports:
  - 竞品相对表现与定位差异的可核验比较
  does_not_support:
  - 用 POI 数量推断竞品经营表现、客流或收入
