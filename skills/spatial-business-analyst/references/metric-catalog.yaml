  - modules/h3/stats.py
- id: poi.grid_density
  name: POI 网格密度
  family: poi_grid
  implementation_status: implemented
  outputs:
  - density_poi_per_km2
  - avg_density_poi_per_km2
  required_inputs:
  - poi_records
  - scope_geometry
  - grid_definition
  - category_schema
  definition: 网格内 POI 数量除以网格面积。
  formula: poi_count / area_km2
  unit: places_per_km2
  spatial_unit: grid_cell
  supports:
  - 单位面积设施集中程度
  - 网格间规范化比较
  does_not_support:
  - 客流
  - 消费能力
  - 营收
  use_when:
  - facility_concentration
  - spatial_mix
  - local_specialization
  combine_with:
  - population.total
  - road.integration
  - nightlight.p90
  valid_comparisons:
  - same_grid_system
  - same_category_scope
  - same_year
  quality_requirements:
  - duplicate_check
  - category_normalization
  - grid_coverage_check
  - minimum_sample_check
  source:
  - modules/poi/aggregation.py
  - modules/h3/stats.py
- id: poi.category_density
  name: POI 分类密度
  family: poi_grid
  implementation_status: implemented
  execution_location: frontend
  outputs:
  - density_by_cat
  required_inputs:
  - poi_records
  - scope_geometry
  - grid_definition
  - category_schema
  definition: 总网格密度按某分类 POI 占比拆分得到的类别密度代理。
  formula: density * category_count / poi_count
  unit: places_per_km2
  supports:
  - 类别供给的空间分布
  does_not_support:
  - 目标业态需求
  - 缺口的独立证明
  use_when:
  - facility_concentration
  - spatial_mix
  - local_specialization
  combine_with:
  - population.total
  - road.integration
  - nightlight.p90
  valid_comparisons:
  - same_year
  - same_grid_definition
  - same_category_schema
  - same_normalization
  quality_requirements:
  - duplicate_check
  - category_normalization
  - grid_coverage_check
  - minimum_sample_check
  source:
  - frontend/src/features/h3/panel.js
- id: poi.local_entropy
  name: POI 类别局部熵
  family: poi_grid
  implementation_status: implemented
  outputs:
  - local_entropy
  - avg_local_entropy
  required_inputs:
  - poi_records
  - scope_geometry
  - grid_definition
  - category_schema
  definition: 网格内 POI 分类比例的 Shannon 熵。
  formula: -sum(p_i * ln(p_i))
  unit: nats
  spatial_unit: grid_cell
  supports:
  - 类别混合程度
  - 单一类别主导与多类别混合的区分
  does_not_support:
  - 业态质量
  - 活跃度
  - 需求强度
  use_when:
  - facility_concentration
  - spatial_mix
  - local_specialization
  combine_with:
  - population.total
  - road.integration
  - nightlight.p90
  valid_comparisons:
  - same_year
  - same_grid_definition
  - same_category_schema
  - same_normalization
  quality_requirements:
  - category_normalization
  - minimum_poi_count
  source:
  - modules/h3/stats.py
- id: poi.local_entropy_normalized
  name: 归一化局部熵
  family: poi_grid
  implementation_status: implemented
  execution_location: frontend
  outputs:
  - displayed_entropy
  required_inputs:
  - poi_records
  - scope_geometry
  - grid_definition
  - category_schema
  definition: 局部熵除以 7 类最大熵后的相对混合度；样本少于阈值时显示无数据。
  formula: local_entropy / ln(7)
  unit: ratio_0_1
  supports:
  - 同一分类体系下的混合度比较
  does_not_support:
  - 多样性质量
  - 市场成熟度
  use_when:
  - facility_concentration
  - spatial_mix
  - local_specialization
  combine_with:
  - population.total
  - road.integration
  - nightlight.p90
  valid_comparisons:
  - same_year
  - same_grid_definition
  - same_category_schema
  - same_normalization
  quality_requirements:
  - duplicate_check
  - category_normalization
  - grid_coverage_check
  - minimum_sample_check
  source:
  - frontend/src/features/h3/panel.js
  - docs/网格分析公式对照表.md
- id: poi.lq
  name: POI 类别区位商
  family: poi_grid
  implementation_status: implemented
  outputs:
  - lq_by_category
  - location_quotient
  required_inputs:
  - poi_records
  - scope_geometry
  - grid_definition
  - category_schema
  definition: 网格内类别占比相对于全局类别占比的比值，使用平滑参数处理小样本。
  formula: cell_share(category) / global_share(category)
  unit: quotient
  supports:
  - 相对专业化
  - 类别相对优势
  does_not_support:
  - 绝对供给充足
  - 需求存在
  - 市场饱和
  use_when:
  - facility_concentration
  - spatial_mix
  - local_specialization
  combine_with:
  - population.total
  - road.integration
  - nightlight.p90
  valid_comparisons:
  - same_classification
  - same_scope
  - same_smoothing_alpha
  quality_requirements:
  - duplicate_check
  - category_normalization
  - grid_coverage_check
  - minimum_sample_check
  source:
  - frontend/src/features/h3/panel.js
  - skills/spatial-business-analyst/scripts/normalized_spatial_metrics.py
  - docs/网格分析公式对照表.md
