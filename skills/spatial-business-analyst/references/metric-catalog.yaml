  valid_comparisons:
  - comparable_competitor_class
  - comparable_operating_period
  quality_requirements:
  - competitor_identity_verified
  - operating_measure_definition
  comparison_baseline:
    required: true
    preferred:
    - same_source_peer_scope
    - documented_project_requirement
    if_missing: 没有同层级、同口径竞品经营证据时，只保留定位假设，不下竞争优劣结论。
  source: []
  implementation_gap: 当前没有竞品经营、到访、出租或收入数据适配器。
