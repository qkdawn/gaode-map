catalog_version: 2.0.0
catalog_status: semantic_catalog
scope: 当前仓库可用、派生或受阻的空间指标语义目录。
decision_metric_policy:
  selection_rule: 一个决策问题先选择互补指标组合，再从组合中执行可用指标。
  minimum_metric_count: 2
  shared_spatial_unit_required: true
  comparison_required: true
  action_change_required: true
  publication_rule: 普通读者报告使用完成组合比较、证据可追溯且会改变行动的指标。

decision_metric_bundles:
  - bundle_id: regional-direction
    decision_question: 哪些方向值得优先做现场踏勘、公共界面和内容差异验证？
    required_metrics:
      - regional.directional_evidence_matrix
    spatial_contract: 同一共同栅格、八方向和距离带；与共同栅格总体平均比较。
    synthesis_rule: 联合解释设施、人口、夜光和路网的空间关系。
    action_change: 改变现场踏勘顺序、公共界面核验和首期试验方向。

  - bundle_id: people-scenarios
    decision_question: 哪些人群场景和时段值得先做低容量验证？
    required_metrics:
      - population.age_structure
      - population.total
      - nightlight.sector_profile
      - poi.grid_density
    spatial_contract: 同一共同栅格和方向/距离带；区域代理与项目内利益相关者约束分开比较。
    synthesis_rule: 人口提出场景，夜光提出观察时段，POI提供周边供给背景。
    action_change: 改变访谈对象、试验时段、活动规模和利益相关者影响核验顺序。

  - bundle_id: content-service
    decision_question: 哪些内容或公共服务值得先做可逆小样？
    required_metrics:
      - poi.category_density
      - poi.local_entropy
      - population.age_structure
      - grid.opportunity_flag
    spatial_contract: POI、人口和派生空间条件必须在同一共同栅格中比较，并与项目材料明确的空间角色对照。
    synthesis_rule: 判断已有供给、类别混合和人群场景是否互补，再形成内容假设。
    action_change: 改变首期内容组合、试验空间和合作方验证顺序。

  - bundle_id: connection
    decision_question: 哪些道路和周边单元值得优先做连接与人行核验？
    required_metrics:
      - road.integration
      - road.choice
      - road.connectivity
      - poi.grid_density
    spatial_contract: 路网指标按同一图模型比较，空间背景按共同栅格对齐，连接节点和人行路径另行核验。
    synthesis_rule: 用整合度、选择度和连通性区分到达、穿行与断点条件，并结合 POI 识别界面特征。
    action_change: 改变道路踏勘、界面记录、连接节点测绘和无障碍核验优先级。

metrics:
- id: poi.count
  name: POI 数量
  family: poi
  implementation_status: implemented
  outputs:
  - count
  - category_counts
  - summary_by_year.count
  required_inputs:
  - poi_records
  - scope_geometry
  - time_scope
  - category_schema
  definition: 研究范围或指定网格内去重后的 POI 记录数。
  unit: places
  answers_questions:
  - 经 15 分钟 walking 等时圈几何核验后，已成立的项目所需配套和同类对标供给各有什么真实主类／附属类结构？
  spatial_granularities:
  - unit: scope
    neighborhood: none
    runtime_parameters: []
  - unit: catchment
    neighborhood: distance
    runtime_parameters:
    - catchment_id
  supports:
  - 将经 15 分钟 walking 等时圈几何核验的 POI 按真实主类／附属类和互补配套／同类对标角色分别盘点
  - 以连续保存道路网络上的五分钟可达记录补充供给空间关系；道路不可用时仍保留等时圈统计
  use_when:
  - facility_supply
  - category_structure
  - competition_context
  actionability:
    action_targets: &id001
    - program_location
    - operations
    possible_actions:
    - 将已审校类型组的等时圈核验供给与五分钟道路可达性作为补充、回避和同类对标的事实背景；道路不可达时保留等时圈总量并省略五分钟值。
  followup_metrics:
  - metric_id: population.total
    purpose: explain
    trigger: 当前指标形成需要解释的差异时
  - metric_id: road.integration
    purpose: validate
    trigger: 当前结论将直接改变项目动作时
  valid_comparisons:
  - same_year
  - same_source
  - same_category_schema
  - same_scope_definition
  quality_requirements:
  - verified_15_minute_walking_isochrone_polygon_or_multipolygon
  - point_inclusion_uses_covers
  - real_taxonomy_resolves_from_share_type_map
  - category_normalization
  - coverage_check
  source:
  - modules/poi/aggregation.py
  - modules/poi/schemas.py
  comparison_baseline:
    required: true
    preferred:
    - same_source_peer_scope
    - same_scope_previous_period
    - same_scope_category_share
