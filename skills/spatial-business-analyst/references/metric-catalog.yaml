- id: project.document_constraints
  name: 项目文件约束与意图提取
  family: project_evidence_gate
  implementation_status: implemented
  outputs:
  - documented_constraints
  - documented_intentions
  - document_conflicts
  required_inputs:
  - versioned_project_documents
  definition: 从已版本化项目文件中提取硬约束、项目意图和文件间冲突，并保持原文来源可追溯。
  unit: evidence_items
  answers_questions:
  - 哪些项目约束和既有承诺必须先于空间、定位和实施方案处理？
  spatial_granularities:
  - unit: scope
    neighborhood: none
    runtime_parameters: []
  supports:
  - 项目文件明确记载的约束、意图与冲突
  does_not_support:
  - 把项目意图自动视为已验证事实或已批准实施条件
  use_when:
  - hard_constraints
  - project_delivery
  actionability:
    action_targets:
    - data_collection
    - operations
    possible_actions:
    - 先解决文件冲突和硬约束，再进入空间与实施承诺。
  followup_metrics:
  - metric_id: project.boundary_geometry
    purpose: locate
    trigger: 文件提到项目红线、入口或界面但尚无正式几何时
  valid_comparisons:
  - documented_constraint_version
  quality_requirements:
  - document_version_traceability
  - intention_fact_separation
  comparison_baseline:
    required: true
    preferred:
    - documented_project_requirement
    if_missing: 项目文件未版本化或来源冲突未解决时，不把项目意图写成既定条件。
  source:
  - modules/spatial_action/project_context.py
- id: project.boundary_geometry
  name: 正式项目边界完整性
  family: project_evidence_gate
  implementation_status: implemented
  outputs:
  - project_boundary_geometry
  required_inputs:
  - formal_project_boundary
  definition: 由项目正式资料或用户明确锚定的项目红线，用于区分项目内部、界面与区域背景。
  unit: geometry
  answers_questions:
  - 哪些空间判断可以安全落到项目内部、边界界面与入口？
  spatial_granularities:
  - unit: scope
    neighborhood: none
    runtime_parameters: []
  supports:
  - 项目内外、边界界面和后续入口分析的正式空间基准
  does_not_support:
  - 用等时圈、中心点或区域分析范围替代项目红线
  use_when:
  - hard_constraints
  - project_boundary
  actionability:
    action_targets:
    - boundary_interface
    - entrance
    - data_collection
    possible_actions:
    - 补充正式红线后再启动项目内部、入口和公共界面比较。
  followup_metrics:
  - metric_id: road.entrance_distance
    purpose: locate
    trigger: 正式项目边界与入口锚点可用时
  valid_comparisons:
  - documented_boundary_version
  quality_requirements:
  - formal_source_traceability
  - coordinate_system_declared
  comparison_baseline:
    required: true
    preferred:
    - documented_project_requirement
    if_missing: 在正式项目边界到位前停止项目内部、入口和界面优劣判断。
  source:
  - modules/spatial_action/project_context.py
- id: competition.operating_performance
