- id: poi.supply_structure
  name: POI 供给结构
  family: poi
  implementation_status: implemented
  outputs:
  - isochrone_verified_real_taxonomy_counts
  - nearby_5_min_road_accessible_counts
  - isochrone_and_taxonomy_audit
  required_inputs:
  - analysis_polygon_or_multipolygon_for_optional_five_minute_origin
  - report_approved_poi_supply_groups
  - saved_15_minute_walking_isochrone_polygon_or_multipolygon
  - current_poi_snapshot
  - optional_saved_current_road_edges_snapshot
  definition: 对报告已审校的互补配套和同类对标类别组，先仅以 `share/type_map.json` 的真实主类和附属类解析 POI，再逐点以保存的 15 分钟 walking 等时圈 Polygon/MultiPolygon 的 `covers` 关系核验。深色数量是经几何核验的等时圈内 POI；如项目 Polygon/MultiPolygon 的几何中心和保存的 current:dataset:road_edges 均可用，再在同一批 POI 上运行本地最短路径并以统一 4.5 km/h 参考步行速度换算不超过 5 分钟的浅色辅助数量。没有连续道路路径时不使用直线距离或替代数量，且不把缺失显示为 0。
  unit: poi_group
  answers_questions:
  - 经 15 分钟 walking 等时圈几何核验后，已成立的项目所需配套和同类对标供给各有什么真实主类／附属类结构？
  - 哪些已审校类型组在项目中心五分钟连续道路范围内已有真实 POI？
  spatial_granularities:
  - unit: scope
    neighborhood: network_radius
    runtime_parameters:
    - groups
  parameter_schema:
    groups:
      type: array
      per_role_max_items: 6
      item:
        required:
        - group_id
        - title
        - role
        - type_codes
        - statement_ref
        properties:
          role:
            enum: [complementary_anchor, comparison_supply]
          type_codes:
            description: 使用当前 POI 快照中真实存在的类别值或 typecode 前缀；同一 typecode 归入唯一组。
          statement_ref:
            required: true
            description: 回指报告中已审校的项目所需配套或同类对标判断；工具不自行生成定位或业态建议。
  supports:
  - 将经 15 分钟 walking 等时圈几何核验的 POI 按真实主类／附属类和互补配套／同类对标角色分别盘点
  - 以连续保存道路网络上的五分钟可达记录补充供给空间关系；道路不可用时仍保留等时圈统计
  use_when:
  - poi_supply_structure
  - complementary_supply
  - comparison_supply
  actionability:
    action_targets:
    - program_location
    - data_collection
    - operations
    possible_actions:
    - 将已审校类型组的等时圈核验供给与五分钟道路可达性作为补充、回避和同类对标的事实背景；道路不可达时保留等时圈总量并省略五分钟值。
  followup_metrics:
  - metric_id: poi.focused_accessibility
    purpose: locate
    trigger: 需要核验某个已审校类别组的具体 POI 名称、道路距离和连续路线时。
  valid_comparisons:
  - same_current_poi_isochrone_snapshot
  - same_analysis_geometry_centroid
  - same_saved_road_edges_snapshot
  - same_poi_type_group_definition
  quality_requirements:
  - verified_15_minute_walking_isochrone_polygon_or_multipolygon
  - point_inclusion_uses_covers
  - real_taxonomy_resolves_from_share_type_map
  - statement_ref_present_for_each_group
  - type_codes_exist_in_current_poi_snapshot
  - no_type_code_overlap_across_groups
  - no_more_than_six_groups_per_role
  - local_continuous_road_path_only
  - no_direct_distance_fallback
  comparison_baseline:
    required: false
    preferred:
    - same_source_peer_scope
    - route_or_spatial_alternative
  source:
  - modules/spatial_action/poi_supply_structure.py
  - modules/spatial_action/road_network_routing.py
  - modules/spatial_action/project_context.py
- id: poi.focused_accessibility
  name: 重点 POI 真实步行可达性
  family: poi
  implementation_status: implemented
  outputs:
  - route_verified_poi_groups
  - route_verified_poi_rows
  - route_verification_diagnostics
  required_inputs:
  - analysis_polygon_or_multipolygon
  - report_approved_poi_type_groups
  - poi_dataset
  - saved_current_road_edges_snapshot
  definition: 从项目 Polygon 或 MultiPolygon 的 Shapely 几何中心点出发，在中心 2 km 内按直线距离筛出的最近 30 个真实 POI 候选上，使用保存的 current:dataset:road_edges 建立本地道路图、将起终点吸附到道路并运行 Dijkstra 最短路径；只输出不超过 15 分钟且存在连续道路几何的真实地点、类别、道路距离和参考步行分钟。分钟按统一 4.5 km/h 换算，路径保留道路转角与曲线，不使用直线、Bezier 或在线路由服务。
  unit: route_verified_poi
  answers_questions:
  - 项目周边哪些真实配套、互补或同类 POI 可经步行路线核验，并值得写入首轮场景与对标判断？
  spatial_granularities:
  - unit: route
    neighborhood: origin_destination
    runtime_parameters:
    - groups
  parameter_schema:
    groups:
      type: array
      max_items: 4
      item:
        required:
        - group_id
        - title
        - role
        - type_codes
        - statement_ref
        properties:
          role:
            enum: [complementary_anchor, comparison_supply]
          type_codes:
            description: 仅可使用当前 poi.category_count 或当前 POI 快照中存在的类别值或 typecode 前缀
          statement_ref:
            required: true
            description: 回指报告中已成立的项目所需配套或同类对标判断
  supports:
  - 在当前 POI 快照与保存路网中识别经连续道路路径计算的近期可达地点
  - 为项目配套与互补锚点、同类与对标供给分别提供可读表格或合并卡片图证据
  use_when:
  - poi_accessibility
  - complementary_supply
  - comparison_supply
  actionability:
    action_targets:
    - program_location
    - route
    - data_collection
    possible_actions:
    - 将可达地点作为首轮现场核验、协同内容和同类供给对标的真实参照；路线失败时保留文字结论并省略表格。
  followup_metrics: []
  valid_comparisons:
  - same_analysis_geometry_centroid
  - same_poi_snapshot
  - same_saved_road_edges_snapshot
  - same_poi_type_group_definition
  quality_requirements:
  - polygon_or_multipolygon_geometry_valid
  - poi_names_and_categories_present
  - local_continuous_road_route_verified
  - no_straight_line_duration_fallback
  - candidate_pool_within_2km_and_nearest_30
  - route_duration_no_more_than_15_minutes
  - statement_ref_present_for_each_group
  - no_more_than_four_groups_or_three_pois_per_group
  comparison_baseline:
    required: false
    preferred:
    - route_or_spatial_alternative
  source:
  - modules/spatial_action/focused_poi_accessibility.py
  - modules/spatial_action/road_network_routing.py
  - modules/spatial_action/project_context.py
