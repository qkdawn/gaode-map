catalog_version: 1.0.0
catalog_status: semantic_catalog
scope: 当前仓库可用、派生或受阻的空间指标语义目录。
interpretation_policy:
- 仅有数量、密度、人口、夜光或路网指标时，不直接表述需求、客流、营业额、购买力或投资回报。
- 比较性指标必须记录比较范围、时间、分类口径、空间分辨率和方法参数。
- 前端派生指标依赖当前批次数据和前端阈值，不视为后端稳定事实。
- implementation_status 为 not_implemented 的指标只能作为证据缺口，不得作为现有证据调用或用相似字段替代。
metrics:
- id: poi.count
  name: POI 数量
  family: poi
  implementation_status: implemented
  outputs:
  - count
  - category_counts
  - summary_by_year.count
  required_inputs:
  - poi_records
  - scope_geometry
  - time_scope
  - category_schema
  definition: 研究范围或指定网格内去重后的 POI 记录数。
  unit: places
  spatial_unit: scope_or_grid
  supports:
  - 设施供给的数量分布
  - 类别之间的数量比较
  does_not_support:
  - 实际营业
  - 客流
  - 需求强度
  - 市场饱和
  use_when:
  - facility_supply
  - category_structure
  - competition_context
  combine_with:
  - population.total
  - road.integration
  - nightlight.mean_radiance
  valid_comparisons:
  - same_year
  - same_source
  - same_category_schema
  - same_scope_definition
  quality_requirements:
  - duplicate_check
  - category_normalization
  - coverage_check
  source:
  - modules/poi/aggregation.py
  - modules/poi/schemas.py
- id: poi.category_count
  name: POI 分类数量
  family: poi
  implementation_status: implemented
  outputs:
  - category_counts
  - category_summary
  required_inputs:
  - poi_records
  - scope_geometry
  - time_scope
  - category_schema
  definition: 按前端传入的 POI 分类匹配规则统计各类别记录数。
  unit: places
  parameters:
  - category_codes
  - classification_level
  - year
  supports:
  - 类别供给构成
  - 类别数量分布
  does_not_support:
  - 类别需求
  - 品牌经营质量
  - 真实业态存续
  use_when:
  - facility_supply
  - category_structure
  - competition_context
  combine_with:
  - population.total
  - road.integration
  - nightlight.mean_radiance
  valid_comparisons:
  - same_year
  - same_source
  - same_category_schema
  - same_scope_definition
  quality_requirements:
  - duplicate_check
  - category_normalization
  - coverage_check
  source:
  - modules/poi/aggregation.py
  - modules/poi/schemas.py
- id: poi.multi_year_count
  name: POI 多年份数量
  family: poi
  implementation_status: implemented
