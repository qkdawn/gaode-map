interface:
  display_name: "Spatial Business Analyst"
  short_description: "基于真实项目材料与空间数据形成定位、空间产品和运营分期决策报告"
  default_prompt: "使用 $spatial-business-analyst，基于现有项目材料和空间数据形成定位、空间产品与运营分期决策报告。"
dependencies:
  - skill_id: cultural-tourism-theme-research
    when: cultural_heritage_or_destination_activation
    stage: preflight
  - skill_id: spatial-market-audience-research
    when: formal_problem_map_confirmed
    stage: market_discovery
workflow_stages:
  - stage: preflight
    owner: cultural-tourism-theme-research
    after: project_loaded
  - stage: market_discovery
    owner: spatial-market-audience-research
    after: problem_map_confirmed
  - stage: product_recheck
    owner: spatial-market-audience-research
    after: parent_drafts_ready
  - stage: visual_editorial
    owner: visual_evidence_editor
    after: publication_assembly_validated
