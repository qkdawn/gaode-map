<div class="agent-thinking-head">
    <div
        v-if="shouldShowAgentThinkingLiveStatus()"
        class="agent-thinking-status"
        aria-live="polite">
        <span class="agent-thinking-dot is-running"></span>
        <span>{{ getAgentThinkingElapsedLabel() ? '已处理 ' + getAgentThinkingElapsedLabel() : getAgentThinkingStatusLabel() }}</span>
    </div>
    <button
        v-else-if="shouldShowAgentThinkingToggle()"
        type="button"
        class="agent-thinking-toggle"
        @click="toggleAgentThinkingExpanded">
        <span class="agent-thinking-dot"></span>
        <span class="agent-thinking-toggle-label">{{ getAgentThinkingElapsedLabel() ? '已处理 ' + getAgentThinkingElapsedLabel() : getAgentThinkingStatusLabel() }}</span>
        <span class="agent-thinking-toggle-icon">
            <span class="agent-thinking-chevron" :class="{ 'is-open': agentThinkingExpanded }">⌄</span>
        </span>
    </button>
</div>
