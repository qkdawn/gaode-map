<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8f5ef"/><text x="65" y="70" font-size="34" font-family="Arial, sans-serif" fill="#222">连接策略：结构证据决定踏勘，正式坐标决定入口</text><rect x="80" y="145" width="290" height="190" rx="18" fill="#dce9e4"/><text x="115" y="205" font-size="27">路网结构</text><text x="115" y="255" font-size="23">1,194 条边</text><text x="115" y="292" font-size="23">780 条低连通段</text><rect x="455" y="145" width="290" height="190" rx="18" fill="#f3ddc9"/><text x="490" y="205" font-size="27">共位候选</text><text x="490" y="255" font-size="23">9 个观察区</text><text x="490" y="292" font-size="23">14 个公共界面候选</text><rect x="830" y="145" width="290" height="190" rx="18" fill="#e5e0ee"/><text x="865" y="205" font-size="27">方向线索</text><text x="865" y="255" font-size="23">夜光较高：东、东南</text><text x="865" y="292" font-size="23">只用于优先踏勘</text><path d="M370 240 L455 240 M745 240 L830 240" stroke="#555" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs><rect x="190" y="420" width="820" height="160" rx="22" fill="#fff" stroke="#bd5a45" stroke-width="4"/><text x="260" y="485" font-size="31" fill="#8b3f31">当前阻塞：正式项目边界缺失，正式入口为 0</text><text x="265" y="535" font-size="25">入口距离、真实绕行、门禁、消防和居民分流不能定案</text><text x="270" y="650" font-size="26" fill="#333">下一步：补红线与入口坐标 → 联合踏勘 → 分流测试 → 再决定开放</text></svg>