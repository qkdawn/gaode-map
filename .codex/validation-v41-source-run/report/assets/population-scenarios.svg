<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f6f7f3"/><text x="65" y="68" font-size="34" font-family="Arial, sans-serif" fill="#222">区域年龄结构 → 三类待验证场景</text><text x="65" y="112" font-size="24" fill="#555">背景区总人口约 58,201 人；不是项目已确认客群</text><rect x="90" y="180" width="300" height="330" rx="22" fill="#dce9e4"/><text x="125" y="245" font-size="29">15—34岁</text><text x="125" y="315" font-size="48" fill="#315e68">15,732</text><text x="125" y="360" font-size="25">27.0%</text><text x="125" y="425" font-size="23">待验证：周末文化</text><text x="125" y="462" font-size="23">共创与复访</text><rect x="450" y="150" width="300" height="360" rx="22" fill="#f3ddc9"/><text x="485" y="220" font-size="29">35—59岁</text><text x="485" y="295" font-size="48" fill="#a65f32">24,298</text><text x="485" y="340" font-size="25">41.7%</text><text x="485" y="405" font-size="23">待验证：工作日家庭事务</text><text x="485" y="442" font-size="23">社区服务</text><rect x="810" y="225" width="300" height="285" rx="22" fill="#e5e0ee"/><text x="845" y="285" font-size="29">60岁以上</text><text x="845" y="350" font-size="48" fill="#685883">10,901</text><text x="845" y="395" font-size="25">18.7%</text><text x="845" y="450" font-size="23">待验证：日间友好</text><text x="845" y="485" font-size="23">代际活动与休息</text><rect x="90" y="560" width="1020" height="82" rx="18" fill="#fff" stroke="#466a73" stroke-width="2"/><text x="130" y="612" font-size="25">最确定的利益相关者：项目内约102户居民，须优先保障生活、通行与安宁</text></svg>