x-app-build: &app-build
  context: .
  dockerfile: docker/Dockerfile

x-app-command: &app-command
  - uvicorn
  - main:app
  - --host
  - 0.0.0.0
  - --port
  - "8000"

x-app-environment: &app-environment
  VALHALLA_BASE_URL: http://valhalla:8002
  # Inside compose, app must use the Docker service name even when local .env points to 127.0.0.1.
  LOCAL_QUERY_BASE_URL: http://search:8001
  # Inside compose, host services are reached through the Docker host bridge.
  # Local Windows backends can keep using 127.0.0.1 in .env.
  ARCGIS_BRIDGE_BASE_URL: ${ARCGIS_BRIDGE_DOCKER_BASE_URL:-http://host.docker.internal:18081}
  OVERPASS_ENDPOINT: http://overpass/api/interpreter
  CITY_BOUNDARY_DIR: /mapdata/boundaries
  POPULATION_DATA_DIR: /mapdata/population
  NIGHTLIGHT_DATA_DIR: /mapdata/nightlight/processed
  PYTHONUNBUFFERED: "1"

x-app-volumes: &app-volumes
  - "${CITY_BOUNDARY_HOST_DIR}:/mapdata/boundaries:ro"
  - "${POPULATION_DATA_HOST_DIR}:/mapdata/population:ro"
  - "${NIGHTLIGHT_DATA_HOST_DIR}:/mapdata/nightlight:ro"

x-app-healthcheck: &app-healthcheck
  test:
    - CMD
    - python
    - -c
    - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 30s

x-valhalla-environment: &valhalla-environment
  build_elevation: "False"
  build_admins: "False"
  build_time_zones: "False"
  server_threads: ${VALHALLA_SERVER_THREADS}
  use_tiles_ignore_pbf: "False"
  use_default_speeds_config: "True"
  default_speeds_config_url: https://raw.githubusercontent.com/OpenStreetMapSpeeds/schema/master/default_speeds.json

x-overpass-environment: &overpass-environment
  OVERPASS_MODE: init
  OVERPASS_META: "no"
  OVERPASS_PLANET_URL: file:///osm/${OVERPASS_PBF_FILE}
  OVERPASS_PLANET_PREPROCESS: mv /db/planet.osm.bz2 /db/planet.osm.pbf && osmium cat /db/planet.osm.pbf -o /db/planet.osm.bz2 -f osm.bz2 --overwrite && rm -f /db/planet.osm.pbf
  OVERPASS_RULES_LOAD: "10"

services:
  search:
    build:
      context: ../search
      dockerfile: Dockerfile
    container_name: gaode-map-search
    env_file:
      - ../search/.env
    ports:
      - "8001:8001"

  app:
    build: *app-build
    container_name: gaode-map-app
    env_file:
      - .env
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *app-environment
    depends_on:
      search:
        condition: service_started
      valhalla:
        condition: service_started
      overpass:
        condition: service_started
    command: *app-command
    volumes: *app-volumes
    healthcheck: *app-healthcheck

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: gaode-map-valhalla
    ports:
      - "8002:8002"
    volumes:
      - "${VALHALLA_CUSTOM_FILES_DIR}:/custom_files"
      - "${VALHALLA_TILES_DIR}:/valhalla/tiles"
    environment: *valhalla-environment
    # Note: Valhalla needs a 'tiles.tar' or PBF files in the mapped volume to start effectively.
    # Without data, it will start but return empty results for routing.

  overpass:
    image: wiktorn/overpass-api:latest
    container_name: gaode-map-overpass
    ports:
      - "8003:80"
    environment: *overpass-environment
    volumes:
      - "${OVERPASS_DB_DIR}:/db"
      - "${OVERPASS_SOURCE_DIR}:/osm:ro"
    restart: unless-stopped
